services:

  backend:
    build:
      context: ./healthconnect-backend-laravel
    container_name: laravel_backend
    restart: unless-stopped
    working_dir: /var/www

    volumes:
      - ./healthconnect-backend-laravel:/var/www

    networks:
      - app_network

    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    container_name: nginx_server
    restart: unless-stopped

    ports:
      - "8001:80"

    volumes:
      - ./healthconnect-backend-laravel:/var/www
      - ./healthconnect-backend-laravel/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    networks:
      - app_network

    depends_on:
      - backend

  frontend:
    build:
      context: ./healthconnect-frontend-react
    container_name: react_frontend
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - ./healthconnect-frontend-react:/app
      - /app/node_modules

    networks:
      - app_network

  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network: